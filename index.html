<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Template</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 0;
        font-family: 'Courier New', Courier, monospace;
        background-color: #0a0a0a;
        background-image:
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        color: #ddd;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    /* Center image */
    .image-frame {
        border: 1px solid #444;
        padding: 4px;
        margin-bottom: 30px;
    }
    .image-frame img {
        max-width: 500px;
        width: 100%;
        display: block;
        filter: grayscale(100%) contrast(1.1);
    }

    /* Title */
    .title {
        font-size: 4em;
        font-weight: bold;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: #e5e5e5;
        text-shadow: 0 0 20px rgba(255,255,255,0.3);
        margin-bottom: 30px;
    }

    /* Terminal box */
    .terminal {
        width: 500px;
        max-width: 90vw;
        background: rgba(15,15,15,0.9);
        border: 1px solid #333;
        border-radius: 10px;
        text-align: left;
        padding: 20px;
    }
    .terminal .line {
        margin: 10px 0;
        font-size: 0.95em;
    }
    .terminal .prompt { color: #999; }
    .terminal .prompt b { color: #fff; }
    .terminal .reply { color: #4ade80; }

    .subfooter {
        margin-top: 20px;
        font-size: 0.75em;
        letter-spacing: 2px;
        color: #666;
        text-transform: uppercase;
    }
</style>
</head>
<body>

    <div class="image-frame">
        <!-- Replace with your own image -->

    </div>
    <audio autoplay loop>
        <source src="https://files.catbox.moe/pi9q1q.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <div class="title">You Are hacked By ALDAWSRI</div>

    <div class="terminal">
        <div class="line prompt">aldawsri@system:~$ <b>Im a king</b></div>
        <div class="line reply">كيف الحال يا الفرخ رايزو تذكر الي لابس رسمي بندته في المطار المدني فوق الهنقر ولله ل اطلعها من عينك ل اونر السيرفر ماني موقف لين يعتذر و يفك الباند او ماني موقف لين اقفل السيرفر</div>
    </div>

    <div class="subfooter">aldawsri</div>

</body>
</html>
