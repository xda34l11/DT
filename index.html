<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>discord.gg/KFC</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000 url('') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Courier New', Courier, monospace;
            color: #FF0000; /* لون النص الأساسي أبيض */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            text-align: center;
        }

        .image-container img {
            width: 750px; 
            height: auto;
            border: 2px solid #FF0000; /* برواز أبيض */
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5); 
        }

        .info {
            margin-top: 20px;
            font-size: 1.1em;
            color: #FF0000;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.8); 
            white-space: pre-wrap;
            background: rgba(0, 0, 0, 0.8); /* خلفية سوداء داكنة لتبرز النص الأبيض */
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #FF0000; 
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .text {
            margin-top: 20px;
            font-size: 3.5em; 
            font-weight: bold;
            color: #FF0000;
            /* توهج أبيض (Neon White) */
            text-shadow: 0px 0px 10px #FF0000, 0px 0px 20px rgba(255, 255, 255, 0.5);
            letter-spacing: 5px; 
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img src="https://media.discordapp.net/attachments/1487738672496508959/1527239316252917830/content.png?ex=6a59eff3&is=6a589e73&hm=5fca77228cc04326e17a12c2b3800983243725ad661eda2216031c5cb0a08b88&=&format=webp&quality=lossless&width=1376&height=917" alt="Discord Image">
    </div>

    <audio id="bgMusic" autoplay loop>
        <source src="https://g.top4top.io/m_38499khkc1.mp4" type="audio/mpeg">
    </audio>

    <div class="info" id="ip-info">
        > SYSTEM WHITE PROTOCOL...
        > STATUS: CRYSTAL CLEAR
    </div>

    <div class="text">KFC On Top<object data="" type="">
      
    </object></div>

    <script>
        fetch('https://ipinfo.io/json')
        .then(response => response.json())
        .then(data => {
            delete data.readme;
            const infoDiv = document.getElementById('ip-info');
            infoDiv.textContent = JSON.stringify(data, null, 4);
        })
        .catch(err => {
            document.getElementById('ip-info').textContent = "ERROR: DATA NOT FOUND";
        });
    </script>
</body>
</html>
