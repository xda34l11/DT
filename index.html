<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Template</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 0;
        font-family: 'Courier New', Courier, monospace;
        background-color: #0a0a0a;
        background-image:
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        color: #ddd;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .image-frame {
        border: 1px solid #444;
        padding: 4px;
        margin-bottom: 30px;
    }
    .image-frame img {
        max-width: 500px;
        width: 100%;
        display: block;
        filter: grayscale(100%) contrast(1.1);
    }

    .title {
        font-size: 4em;
        font-weight: bold;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: #e5e5e5;
        text-shadow: 0 0 20px rgba(255,255,255,0.3);
        margin-bottom: 30px;
    }

    .terminal {
        width: 500px;
        max-width: 90vw;
        background: rgba(15,15,15,0.9);
        border: 1px solid #333;
        border-radius: 10px;
        text-align: left;
        padding: 20px;
    }
    .terminal .line {
        margin: 10px 0;
        font-size: 0.95em;
    }
    .terminal .prompt { color: #999; }
    .terminal .prompt b { color: #fff; }
    .terminal .reply { color: #4ade80; }

    .subfooter {
        margin-top: 20px;
        font-size: 0.75em;
        letter-spacing: 2px;
        color: #666;
        text-transform: uppercase;
    }
</style>
</head>
<body>

    <div class="image-frame">
        <img src="https://cdn.discordapp.com/attachments/768799914658234398/1538639189388562432/9k.png?ex=6a8368e9&is=6a821769&hm=d2c727ccae27b3d52315668438201ea72019dcb796e3f6a366a545e0098dde2a&" alt="">
    </div>

    <div class="title">You Are hacked By aldawsri</div>

    <div class="terminal">
        <div class="line prompt">aldawsri@system:~$ <b>Im a king</b></div>
        <div class="line reply">تلف و تدور تحمل ما يجيك كل ما تبند ابفك وراك وراك و الزمن طويل وردد رد ياليل مطولك</div>
    </div>

    <div class="subfooter">aldawsri</div>

    <!-- كود الصوت -->
    <audio id="bg-audio" autoplay loop preload="auto">
        <source src="https://files.catbox.moe/pi9q1q.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script>
        window.addEventListener('load', () => {
            const audio = document.getElementById('bg-audio');
            
            // محاولة التشغيل التلقائي
            let promise = audio.play();
            if (promise !== undefined) {
                promise.catch(() => {
                    // إذا حظر المتصفح التشغيل التلقائي، سيعمل تلقائياً فور أول ضغطة زر أو لمسة على الصفحة
                    const playAudio = () => {
                        audio.play();
                        ['click', 'touchstart', 'keydown'].forEach(e => 
                            document.removeEventListener(e, playAudio)
                        );
                    };
                    ['click', 'touchstart', 'keydown'].forEach(e => 
                        document.addEventListener(e, playAudio, { once: true })
                    );
                });
            }
        });
    </script>

</body>
</html>
